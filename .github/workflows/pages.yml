# Membangun dan menerbitkan situs progres dari docs/ ke GitHub Pages.
#
# Situs tidak diterbitkan apa adanya dari repositori: ia dibangun ulang dari
# content/ dan design_lock.json lebih dulu, lalu langkah `check` memastikan
# hasil pembangunan ulang itu sama dengan yang di-commit. Dengan begitu halaman
# yang tayang tidak bisa memuat angka yang berbeda dari pipeline.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Terbitkan angka pipeline sebagai data untuk halaman publik
        run: python -m tools.build data
      - name: Render notebook ke HTML
        run: |
          mkdir -p docs/notebooks
          python -m jupyter nbconvert --to html --output-dir docs/notebooks \
            notebooks/01_tahap0_go_nogo.ipynb || \
            echo "nbconvert gagal; situs tetap dibangun tanpa notebook"
      - name: Sertakan laporan hasil jalankan
        run: |
          mkdir -p docs/results
          cp -r results/demo docs/results/demo || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
