# ============================================================================
# KONFIGURASI SUNGGUHAN — konstruk circRNA-HBsAg (PIE, satu IRES = CVB3)
# ============================================================================
# provenance_policy: strict berarti pipeline MENOLAK berjalan bila ada bagian
# yang ditandai `synthetic: true`. Dengan begitu, angka yang keluar dari
# konfigurasi ini pasti berasal dari sekuens yang Anda sediakan sendiri.
#
# BERKAS DI data/reference/ BELUM ADA DI REPOSITORI INI secara sengaja:
# sekuens virus dan intron tidak diikutkan agar provenansnya tidak kabur, dan
# agar Anda mencatat sendiri nomor aksesi serta versi yang dipakai.
# Lihat data/reference/README.md untuk perintah unduhnya.
#
# Keputusan desain dan justifikasinya ada di docs/DESIGN.md.
# ============================================================================

provenance_policy: strict

protein:
  file: data/reference/hbsag_S_protein.fa
  accession: "AAB59969.1"           # protein_id; genom induk U95551.1 (subtipe ayw, klon 2.2.15)
  genotype: "D"  # [PERLU VERIFIKASI] ayw umumnya genotipe D; konfirmasi dengan HBVdb/BLAST
  note: >
    Protein S-HBsAg kecil (SHBs). Justifikasi pemilihan S (bukan L/M/S) dan
    genotipe B ada di docs/DESIGN.md. Catat nomor aksesi, versi, dan tanggal
    unduh pada notebooks/01_tahap0_go_nogo.ipynb.

design:
  ires_choice: CVB3
  ires_justification: >
    [LITERATUR] IRES CVB3 adalah IRES yang paling sering dipakai pada circRNA
    translasi berbasis PIE dan menjadi rujukan acuan pada draf TA. Lihat
    docs/DESIGN.md untuk justifikasi lengkap beserta sitasinya.
  target_gc: 0.50
  max_circle_nt: 3000

parts:
  T7_promoter:
    inline: "TAATACGACTCACTATA"
    source: "Promotor T7 kanonik (untai atas)"
    note: "[LITERATUR] sekuens konsensus promotor T7."

  gg_leader:
    inline: "GGG"
    note: >
      [LITERATUR] Tiga G pertama pada transkrip meningkatkan efisiensi inisiasi
      T7 dan memungkinkan rasio GMP:GTP 5:1 untuk capping/inisiasi termodifikasi.

  HA5:
    file: data/reference/homology_arm_5.fa
    source: "ISI_SENDIRI"
    note: "Lengan homologi 5'. Panjang dioptimasi pada tahap `optimize`."

  intron_3half:
    file: data/reference/intron_3half.fa
    accession: "ISI_SENDIRI"
    source: "Intron grup I permuted (separuh 3'), mis. pre-tRNA-Leu Anabaena"
    role: "separuh intron sisi 3' (berisi IGS untuk P10)"
    features:
      # WAJIB DISESUAIKAN dengan koordinat IGS pada sekuens yang Anda pakai.
      # [awal, akhir) relatif terhadap awal bagian ini, 0-based.
      IGS: [0, 6]
    note: >
      Koordinat IGS menentukan wilayah P1/P10 yang diukur aksesibilitasnya.
      Bila dibiarkan salah, kriteria junction_accessibility akan memakai
      nilai netral dan laporan akan menyebut jumlah wilayah yang terukur.

  E2:
    file: data/reference/E2.fa
    source: "ISI_SENDIRI"
    role: "eksón 2 — sisi 3' sambungan balik"

  spacer5:
    inline: "ACTAACTACAATCAACTACAATCAACTAACAATC"
    note: "[PERKIRAAN] nilai awal; dioptimasi oleh `circhbsag.optimize`."

  IRES:
    file: data/reference/ires_cvb3.fa
    accession: "ISI_SENDIRI"
    source: "5'UTR Coxsackievirus B3 (IRES tipe I)"
    note: "Catat koordinat awal/akhir IRES yang dipotong dari 5'UTR."

  ORF:
    inline: "ATGTAA"
    note: >
      Placeholder. Alur Snakemake menggantinya dengan hasil
      `circhbsag.cli codon` (ORF HBsAg teroptimasi kodon).

  spacer3:
    inline: "AAACAAAGAAACAAAGAAACAAAGAAACAAAG"
    note: "[PERKIRAAN] nilai awal; dioptimasi oleh `circhbsag.optimize`."

  E1:
    file: data/reference/E1.fa
    source: "ISI_SENDIRI"
    role: "eksón 1 — sisi 5' sambungan balik"

  intron_5half:
    file: data/reference/intron_5half.fa
    accession: "ISI_SENDIRI"
    source: "Intron grup I permuted (separuh 5')"
    role: "separuh intron sisi 5' (berisi IGS untuk P1)"
    features:
      IGS: [0, 6]

  HA3:
    file: data/reference/homology_arm_3.fa
    source: "ISI_SENDIRI"

  T7_terminator:
    optional: true
    note: >
      Letakkan terminator T7 di luar wilayah prekursor, atau linearisasi
      templat dengan enzim restriksi unik. Terminator di dalam prekursor
      terdeteksi sebagai pelanggaran gerbang keras `no_premature_T7_terminator`.
