# Peta alur: langkah -> perintah -> masukan -> keluaran (hasil antara).
# Dipakai oleh scripts/13_export_workbook.py (sheet Peta_alur) dan docs/ALUR_DAN_BOBOT.md.
# <out> = folder keluaran (default results/demo untuk demo; results/ untuk konfigurasi sungguhan).
steps:
  - {no: 1, step: "Ambil sekuens acuan", script: "scripts/01_fetch_sequences.py", snakemake: "-", input: "data/raw/accessions.tsv", output: "data/raw/<bagian>.fa, data/raw/provenance.tsv", note: "Aksesi kosong -> [PERLU VERIFIKASI], tidak ditebak"}
  - {no: 2, step: "Optimasi kodon ORF", script: "scripts/02_codon_optimize.py", snakemake: "codon_optimize (CLI codon)", input: "protein (parts.yaml: protein.file), data/reference/codon_usage_human.tsv", output: "<out>/orf_optimized.fa, <out>/codon.json", note: "CAI terhadap tabel kodon manusia [PERKIRAAN]"}
  - {no: 3, step: "Rakit prekursor dan lingkaran", script: "scripts/03_assemble_construct.py", snakemake: "(di dalam tahap0/gate0)", input: "parts.yaml + orf_optimized.fa", output: "<out>/tables/construct.fa, construct_features.tsv, precursor.gb", note: ""}
  - {no: 4, step: "Gate 0 (9 uji) + kunci desain", script: "scripts/04_gate0_circularization_check.py", snakemake: "gate0 (CLI gate0; di luar rule all)", input: "parts.yaml + orf_optimized.fa", output: "<out>/reports/gate0.json, gate0.md, design_lock.json", note: "design_lock.json = sumber angka untuk situs dan dokumen"}
  - {no: 5, step: "Lipatan RNA", script: "scripts/05_fold_analysis.py", snakemake: "(di dalam tahap0)", input: "konstruk", output: "<out>/tables/fold_analysis.tsv", note: "ViennaRNA"}
  - {no: 6, step: "Integritas IRES", script: "scripts/06_ires_integrity.py", snakemake: "(di dalam tahap0)", input: "konstruk", output: "<out>/tables/ires_integrity.json", note: "Uji 6"}
  - {no: 7, step: "Pindai m6A RRACH", script: "scripts/07_m6a_rrach_scan.py", snakemake: "(di dalam tahap0)", input: "konstruk", output: "<out>/tables/m6a_rrach_sites.tsv", note: ""}
  - {no: 8, step: "Pindai batang dsRNA", script: "scripts/08_dsrna_stem_scan.py", snakemake: "(di dalam tahap0)", input: "konstruk", output: "<out>/tables/dsrna_stems.json", note: "Uji 7"}
  - {no: 9, step: "Cakupan epitop/HLA", script: "scripts/09_epitope_hla_coverage.py", snakemake: "-", input: "keluaran NetMHCpan LOKAL (tidak disertakan)", output: "<out>/tables/epitope_hla_coverage.json", note: "Berstatus UNAVAILABLE bila tidak ada masukan; tidak diisi angka karangan"}
  - {no: 10, step: "Primer dan probe", script: "scripts/10_primer_design.py", snakemake: "primers (CLI primers)", input: "konstruk", output: "<out>/primers.json", note: "primer3"}
  - {no: 11, step: "Simulasi BSJ", script: "(CLI bsj-sim)", snakemake: "bsj_simulation", input: "konstruk", output: "<out>/bsj_simulation.json", note: "Data simulasi, bukan sekuensing"}
  - {no: 12, step: "Off-target", script: "(CLI offtarget)", snakemake: "offtarget", input: "BLAST+ atau FASTA referensi lokal", output: "<out>/offtarget_report.json", note: "SKIPPED eksplisit bila tak ada referensi"}
  - {no: 13, step: "Optimasi multi-objektif (Optuna)", script: "(CLI optimize)", snakemake: "optimize (di luar rule all; lama)", input: "parts.yaml", output: "<out>/optimization.json", note: "40 percobaan default; 24 Pareto di demo"}
  - {no: 14, step: "Loop redesain Gate 0", script: "(CLI redesign)", snakemake: "-", input: "parts.yaml", output: "<out>/gate0_iterations.json, .md", note: "satu parameter per iterasi"}
  - {no: 15, step: "Gambar", script: "scripts/11_make_figures.py", snakemake: "-", input: "konstruk", output: "<out>/figures/*.png", note: ""}
  - {no: 16, step: "Laporan Gate 0", script: "scripts/12_build_report.py", snakemake: "-", input: "reports/gate0.md + tiga tabel wajib", output: "<out>/reports/gate0_report.md", note: ""}
  - {no: 17, step: "Ringkasan satu halaman", script: "-", snakemake: "summary", input: "semua JSON", output: "<out>/SUMMARY.md", note: ""}
  - {no: 18, step: "Tabel lengkap (xlsx + CSV)", script: "scripts/13_export_workbook.py", snakemake: "workbook", input: "semua keluaran di atas", output: "<out>/tables/circhbsag_hasil_lengkap.xlsx, <out>/tables/csv/*.csv", note: "tidak menghitung angka baru"}
# Rubrik v2 yang dipakai kandidat V1–V18: SNAPSHOT dari salinan kerja terpisah (rubric2.py) (20 Nov 2026).
# Belum ada di repo; bobot disalin apa adanya. Jangan dipakai sebagai hasil repo.
rubric_v2_snapshot:
  source: "rubric2.py pada salinan kerja terpisah, belum di-commit ke repo"
  go: 0.70
  conditional: 0.55
  weights:
    splicing_competence: 0.25
    junction_accessibility: 0.15
    ires_integrity: 0.15
    dsrna_burden: 0.10
    start_codon_accessibility: 0.10
    circle_stability: 0.10
    sequence_cleanliness: 0.10
    motif_burden: 0.05
  hard_gates_added_vs_v1:
    - "IRES identik 100% dengan AF169665.1"
    - "intron identik 100% dengan intron Ana acuan"
    - "ORF menerjemahkan protein S persis tanpa stop internal"
    - "lengan homologi <= 50 nt (Shen dkk. 2025 Fig. 2f)"
    - "efisiensi dasar prediksi ekson >= 25%"
  why_changed: "v1: kontrol negatif skor tertinggi sehingga rubrik tidak valid; v2 menambah kriteria splicing_competence dari data Shen dkk. 2025, menilai IRES pada 37 C, mengukur aksesibilitas relatif terhadap konstruk minimal, dan menormalkan stabilitas terhadap pengacakan dinukleotida (docstring rubric2.py)."
  controls: ["PC1 V1 paper CIRC-V1", "PC2 V1 bebas BsmBI", "PC3 16-16 spacer20 tanpa lengan", "NC1 ekson 1-1", "NC2 IRES diacak", "NC3 ORF kodon stop dini", "NC4 intron diacak", "NC5 lengan 100 nt"]
